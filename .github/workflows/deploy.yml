name: Refresh jobs and deploy

# Every morning: refresh the sponsor registers (weekly), poll the job boards and
# feeds, export the data, upload it to the API's KV namespace, then build the app
# and publish it to Cloudflare Pages. Postings are served by the API, not by the
# static site. A push to main redeploys from the cached database without re-polling.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers KV edit + Pages edit)
# and CLOUDFLARE_ACCOUNT_ID, and repository variables KV_NAMESPACE_ID (the
# Worker's DATA namespace) and API_URL (the Worker's URL).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      poll:
        description: "Poll the job boards (otherwise reuse the cached data)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  KV: --namespace-id ${{ vars.KV_NAMESPACE_ID }} --remote
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The SQLite history (first-seen dates, closed postings) and the register
      # downloads live in the Actions cache between runs, with a gzipped copy of
      # the database in KV in case the cache is evicted.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Restore database from KV if the cache is gone
        if: hashFiles('pipeline/data/atlas.db') == ''
        run: |
          mkdir -p pipeline/data
          backup="$RUNNER_TEMP/atlas.db.gz"
          if npx --yes wrangler@4 kv key get state/atlas.db.gz $KV > "$backup" && gunzip -t "$backup"; then
            gunzip -c "$backup" > pipeline/data/atlas.db
          else
            echo "No backup yet; starting fresh."
          fi

      - name: Poll job boards and export
        working-directory: pipeline
        env:
          POLL: ${{ github.event_name == 'schedule' || inputs.poll || hashFiles('pipeline/data/atlas.db') == '' }}
        run: |
          # Also poll when the cached data is stale or came from an interrupted run.
          if [ "$POLL" != "true" ] && [ "$(python -m jobtracker fresh)" != "yes" ]; then POLL=true; fi
          if [ "$POLL" = "true" ]; then
            python -m jobtracker run
          else
            python -m jobtracker export
          fi
          python -m jobtracker trend | tail -n 5

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}

      - name: Upload data to KV
        working-directory: site/public/data
        run: |
          put() { npx --yes wrangler@4 kv key put "$1" --path "$2" $KV; }
          for f in jobs/*.json; do put "$f" "$f"; done
          put market.json market.json
          put meta.json meta.json
          # KV values are capped at 25 MiB; the database compresses to about a quarter.
          gzip -9 -c ../../../pipeline/data/atlas.db > "$RUNNER_TEMP/atlas.db.gz"
          put state/atlas.db.gz "$RUNNER_TEMP/atlas.db.gz"
          # Last: the Worker reloads its cached files when this changes.
          npx --yes wrangler@4 kv key put version "$(date -u +%s)" $KV

      # Postings must not ship with the static site: the API is the only way to them.
      - name: Remove job data from the site build
        run: rm -rf site/public/data

      - name: Build site
        working-directory: site
        # Repository variables (not secrets: all of these end up in the public bundle).
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          VITE_LEGAL_ID: ${{ vars.LEGAL_ID }}
          VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
        run: |
          npm ci
          npm test
          npm run build
          test ! -e dist/data/jobs.json

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site/dist --project-name visa-job-atlas --branch main
