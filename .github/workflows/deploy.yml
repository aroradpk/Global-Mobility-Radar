name: Refresh jobs and deploy

# Every morning: refresh the sponsor registers (weekly), poll the job boards and
# feeds, export the data, upload it to the API's R2 bucket, then build the app
# and publish it to Cloudflare Pages. Postings are served by the API, not by the
# static site. A push to main redeploys from the cached database without re-polling.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (R2 edit + Pages edit) and
# CLOUDFLARE_ACCOUNT_ID, and a repository variable API_URL (the Worker's URL).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      poll:
        description: "Poll the job boards (otherwise reuse the cached data)"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: visa-job-atlas-data
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The SQLite history (first-seen dates, closed postings) and the register
      # downloads live in the Actions cache between runs, with a copy in R2 in
      # case the cache is evicted.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Restore database from R2 if the cache is gone
        if: hashFiles('pipeline/data/atlas.db') == ''
        run: |
          mkdir -p pipeline/data
          npx --yes wrangler@4 r2 object get "$BUCKET/state/atlas.db" --file pipeline/data/atlas.db --remote || echo "No backup yet; starting fresh."

      - name: Poll job boards and export
        working-directory: pipeline
        env:
          POLL: ${{ github.event_name == 'schedule' || inputs.poll || hashFiles('pipeline/data/atlas.db') == '' }}
        run: |
          # Also poll when the cached data is stale or came from an interrupted run.
          if [ "$POLL" != "true" ] && [ "$(python -m jobtracker fresh)" != "yes" ]; then POLL=true; fi
          if [ "$POLL" = "true" ]; then
            python -m jobtracker run
          else
            python -m jobtracker export
          fi
          python -m jobtracker trend | tail -n 5

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ github.run_id }}

      - name: Upload data to R2
        working-directory: site/public/data
        run: |
          put() { npx --yes wrangler@4 r2 object put "$BUCKET/$1" --file "$2" --content-type "${3:-application/json}" --remote; }
          for f in jobs/*.json; do put "$f" "$f"; done
          put market.json market.json
          put meta.json meta.json
          put state/atlas.db ../../../pipeline/data/atlas.db application/octet-stream

      # Postings must not ship with the static site: the API is the only way to them.
      - name: Remove job data from the site build
        run: rm -rf site/public/data

      - name: Build site
        working-directory: site
        # Repository variables (not secrets: all of these end up in the public bundle).
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          VITE_LEGAL_ID: ${{ vars.LEGAL_ID }}
          VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
        run: |
          npm ci
          npm test
          npm run build
          test ! -e dist/data/jobs.json

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site/dist --project-name visa-job-atlas --branch main
