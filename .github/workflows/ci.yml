name: Safe CI baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'development/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/check_repository_safety.py

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only, no live polling)
        working-directory: pipeline
        run: python -m unittest discover -s tests -v

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Audit locked dependencies (high/critical gate)
        run: npm audit --package-lock-only --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build production preview
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Audit browser test tooling
        working-directory: tools/browser
        run: npm audit --package-lock-only --audit-level=high
      - name: Install audited browser tooling
        working-directory: tools/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        working-directory: tools/browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        working-directory: tools/browser
        run: npm test

  # One-shot research check on an isolated branch. Never promote this job.
  commercial-feasibility-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development/commercial-feasibility' && contains(github.event.head_commit.message, '[one-shot-cc0]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Bounded government source observation (aggregate only)
        working-directory: pipeline
        run: python -m jobtracker.feasibility --live --sample
      - name: Existing matching engine on ephemeral sample
        working-directory: site
        env:
          GMR_LIVE_FEASIBILITY: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- src/engine/liveFeasibility.test.js
      - name: Discard ephemeral sample
        if: always()
        run: rm -f pipeline/data/feasibility-evaluation.json
