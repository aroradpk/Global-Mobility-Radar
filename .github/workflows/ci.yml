name: Safe CI baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'development/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/check_repository_safety.py

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only, no live polling)
        working-directory: pipeline
        run: python -m unittest discover -s tests -v

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Audit locked dependencies (high/critical gate)
        run: npm audit --package-lock-only --audit-level=high

  dependency-upgrade-candidate:
    if: github.ref == 'refs/heads/development/security-dependency-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Pin npm 11 resolver on disposable runner
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.21.3
          test "$(npm --version)" = "11.21.3"
      - name: Resolve candidate from a fresh lock on the disposable runner
        run: |
          npm pkg set devDependencies.vite=7.3.8 devDependencies.vitest=4.1.12 devDependencies.@vitejs/plugin-react=5.1.4
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit candidate lock
        run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Print validated candidate manifests for review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const name of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(readFileSync(name, 'utf8'));
            if (name === 'package-lock.json') {
              for (const entry of Object.values(data.packages)) {
                if (entry.resolved && (!entry.resolved.startsWith('https://registry.npmjs.org/') || !entry.integrity)) throw new Error('Unexpected lock provenance');
              }
            }
            console.log('CANDIDATE_BEGIN ' + name);
            for (const line of JSON.stringify(data, null, 2).split('\n')) console.log('CANDIDATE_LINE ' + line);
            console.log('CANDIDATE_END ' + name);
          }
          NODE
