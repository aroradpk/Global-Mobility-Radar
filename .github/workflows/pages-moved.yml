# Run once, by hand, after the Cloudflare Pages site is live: replaces the old
# GitHub Pages site with a page that sends visitors to the new address.
name: Point GitHub Pages to the new site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  moved:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Write the redirect page
        run: |
          test -n "$SITE_URL" || { echo "Set the SITE_URL repository variable first"; exit 1; }
          mkdir out
          cat > out/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width">
          <meta http-equiv="refresh" content="3; url=$SITE_URL">
          <link rel="canonical" href="$SITE_URL">
          <title>Visa Job Atlas has moved</title>
          <body style="font-family:-apple-system,Segoe UI,Arial,sans-serif;max-width:520px;margin:15vh auto;padding:16px;text-align:center">
          <h1>Visa Job Atlas mudou de endereço · has moved</h1>
          <p><a href="$SITE_URL">$SITE_URL</a></p>
          </body>
          EOF
          cp out/index.html out/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
